<form class="search-panel mb-4" method="get" action="{% if available %}{% url 'catalog:available' %}{% else %}{% url 'catalog:ideas' %}{% endif %}">
  {% if form.errors %}
    <p class="alert alert-danger w-100 mb-0" role="alert">Проверьте параметры поиска.</p>
  {% endif %}
  {% if form.non_field_errors %}<div class="text-danger">{{ form.non_field_errors }}</div>{% endif %}
  {% for field in form %}
    <div class="search-field{% if field.name == 'q' %} search-query{% endif %}">
      {{ field.label_tag }}
      {{ field }}
      {% if field.errors %}<div class="text-danger">{{ field.errors }}</div>{% endif %}
    </div>
  {% endfor %}
  <div class="search-actions">
    <button class="btn btn-primary" type="submit">Найти</button>
    <a class="btn btn-outline-primary" href="{% if available %}{% url 'catalog:available' %}{% else %}{% url 'catalog:ideas' %}{% endif %}">Сбросить</a>
  </div>
</form>
