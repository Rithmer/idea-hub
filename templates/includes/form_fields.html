{% if form.non_field_errors %}<div class="text-danger">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  <div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}
      <div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>
    {% endif %}
    {% if field.errors %}<div class="text-danger">{{ field.errors }}</div>{% endif %}
  </div>
{% endfor %}
