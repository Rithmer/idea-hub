{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Главная{% endblock %} · IdeaHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
  {% include "includes/navigation.html" %}
  <main id="main-content" class="container site-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="container site-footer">
    <span>© <span id="current-year">{% now "Y" %}</span> <strong>IdeaHub</strong> · каталог проектных идей</span>
    <span>От первой идеи — к своему проекту.</span>
  </footer>
  <script src="{% static 'homepage/js/main.js' %}" defer></script>
</body>
</html>
